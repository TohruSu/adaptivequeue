[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptivequeue"
version = "0.1.0"
description = "A job scheduling simulator with classical and tabular Q-Learning policies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/TohruSu/adaptivequeue"
Documentation = "https://github.com/TohruSu/adaptivequeue/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14"]
benchmark = ["matplotlib>=3.8"]

[project.scripts]
adaptivequeue = "adaptivequeue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
files = ["src/adaptivequeue"]
python_version = "3.10"
strict = true
